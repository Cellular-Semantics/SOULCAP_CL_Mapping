[project]
name = "soulcap-cl-mapping"
version = "0.1.0"
description = "Mappings between SOULCAP cell types and the Cell Ontology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "requests>=2.32",
    "openpyxl>=3.1",
]

[project.scripts]
soulcap-sync = "soulcap_cl_mapping.sync_sheets:main"
soulcap-validate = "soulcap_cl_mapping.marker_syntax:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulcap_cl_mapping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=soulcap_cl_mapping --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["soulcap_cl_mapping"]
