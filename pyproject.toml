[project]
name = "soulcap-cl-mapping"
version = "0.1.0"
description = "Mappings between SOULCAP cell types and the Cell Ontology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "requests>=2.32",
    "openpyxl>=3.1",
    "SPARQLWrapper>=2.0",
    "certifi>=2024.0",
    "oaklib>=0.6.23",
    "sssom>=0.4.17",
]

[project.scripts]
soulcap-sync = "soulcap_cl_mapping.sync_sheets:main"
soulcap-validate = "soulcap_cl_mapping.marker_syntax:main"
soulcap-cache = "soulcap_cl_mapping.snippet_cache:main"
soulcap-validate-report = "soulcap_cl_mapping.report_validator:main"
soulcap-cl-pro = "soulcap_cl_mapping.cl_pro:main"
soulcap-lookup = "soulcap_cl_mapping.ols4_lookup:main"
soulcap-match = "soulcap_cl_mapping.cl_match:main"
soulcap-tokens = "soulcap_cl_mapping.marker_syntax:tokens_main"
soulcap-hgnc = "soulcap_cl_mapping.hgnc_map:main"
soulcap-map = "soulcap_cl_mapping.marker_map:main"
soulcap-oak-match = "soulcap_cl_mapping.oak_match:main"
soulcap-sssom = "soulcap_cl_mapping.sssom_export:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulcap_cl_mapping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=soulcap_cl_mapping --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["soulcap_cl_mapping"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["oaklib.*", "sssom.*", "sssom_schema.*", "curies.*"]
ignore_missing_imports = true
